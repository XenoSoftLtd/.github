# Adds the triggering issue or pull request to the XenoSoftLtd product project (Project 10).
# Called from each product repo's .github/workflows/project-intake.yml.
# Status moves (Todo / In Progress / Done) are handled by the project's built-in workflows, not here.
name: Project intake

on:
  workflow_call:
    secrets:
      PROJECT_BOT_CLIENT_ID:
        required: true
      PROJECT_BOT_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint project bot token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.PROJECT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PROJECT_BOT_PRIVATE_KEY }}
          owner: XenoSoftLtd
          permission-organization-projects: write
          permission-issues: read
          permission-pull-requests: read

      - name: Add item to Project 10
        uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/orgs/XenoSoftLtd/projects/10
          github-token: ${{ steps.token.outputs.token }}
