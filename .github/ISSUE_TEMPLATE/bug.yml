name: Bug
description: Something behaves wrongly.
title: "[Bug]: "
type: Bug
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment and version
      placeholder: lx-srv-01 dev, API 2.25.2, UI 2.20.0
